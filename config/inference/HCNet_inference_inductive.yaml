output_dir: ~/HYPER/output

dataset:
  class: {{ dataset }}
  root: ~/HYPER/kg-datasets/
  version: {{ version }}

model:
  class: TransductiveHCNet
  entity_model:
    class: EntityHCNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    aggregate_func: sum
    short_cut: yes
    use_triton: yes

optimizer:
  class: AdamW
  lr: 5.0e-4


task:
  name: InductiveInference
  num_negative: 256
  # Disease is position 0 and remains fixed as the stratification context.
  corrupt_positions: [1, 2, 3]
  eval_positions: [1, 2, 3]
  negative_sampling: strict_typed
  typed_eval: yes
  node_specific_typed_evaluation: no
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]

train:
  gpus: {{ gpus }}
  batch_size: 8
  num_epoch: {{ epochs }}
  eval_interval: 1
  log_interval: 100
  batch_per_epoch: {{ bpe }}

checkpoint: {{ ckpt }}
